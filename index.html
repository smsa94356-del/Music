<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الأغاني بالذكاء الاصطناعي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 80px; }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0369a1; }
        #result { margin-top: 20px; text-align: center; font-size: 14px; color: #a1a1aa; }
    </style>
</head>
<body>

    <div class="container">
        <h2>استوديو الذكاء الاصطناعي</h2>
        
        <label>صف اللحن أو الموسيقى:</label>
        <input type="text" id="musicPrompt" placeholder="مثال: موسيقى حزينة هادئة...">

        <label>اكتب الكلمات الجديدة:</label>
        <textarea id="lyricsInput" placeholder="اكتب الكلمات التي تريد غناءها هنا..."></textarea>

        <button onclick="generateSong()">توليد الأغنية</button>

        <div id="result"></div>
    </div>

    <script>
        function generateSong() {
            const music = document.getElementById( musicPrompt ).value;
            const lyrics = document.getElementById( lyricsInput ).value;
            const resultDiv = document.getElementById( result );

            if(!music || !lyrics) {
                alert( الرجاء إدخال وصف الموسيقى والكلمات أولاً! );
                return;
            }

            resultDiv.innerHTML = "⏳ جاري معالجة الصوت والألحان بالذكاء الاصطناعي... يرجى الانتظار";
            
            // محاكاة عملية التوليد (يمكنك ربطه بأي API حقيقي لاحقاً)
            setTimeout(() => {
                resultDiv.innerHTML = "✅ تم توليد الأغنية بنجاح! (جاهزة للتحميل)";
            }, 3000);
        }
    </script>

</body>
</html>

  <script>
  // الحصول على زر التوليد بناءً على الكلاس أو الـ ID أو نوع الزر
  const generateBtn = document.querySelector( button ); // أو استبدله بالـ ID الخاص بك
  
  if (generateBtn) {
      generateBtn.addEventListener( click , function(e) {
          e.preventDefault(); // منع إعادة تحميل الصفحة إذا كان داخل نموذج (Form)
          
          // رسالة تجريبية للتأكد من أن الزر أصبح يتحرك ويستجيب
          alert( جاري معالجة وتوليد الأغنية، يرجى الانتظار... );
          
          // هنا يمكنك وضع كود الاتصال بالخدمة أو السيرفر الخاص بك لاحقاً
      });
  }
</script>
