<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو الذكاء الاصطناعي</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1b263b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #4ea8de;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            text-align: right;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #0d1b2a;
            border: 1px solid #415a77;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #0077b6;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0096c7;
        }
        #result {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>استوديو الذكاء الاصطناعي</h2>
        
        <label>صف اللحن أو الموسيقى:</label>
        <input type="text" id="musicInput" placeholder="موسيقى وبيت سعاده">
        
        <label>اكتب الكلمات الجديدة:</label>
        <textarea id="lyricsInput" rows="4" placeholder="اكتب كلمات الأغنية هنا..."></textarea>
        
        <button onclick="generateSong()">توليد الأغنية</button>
        
        <div id="result"></div>
    </div>

    <!-- كود الجافاسكريبت لتشغيل الزر والتفاعل معه -->
    <script>
        function generateSong() {
            const music = document.getElementById( musicInput ).value;
            const lyrics = document.getElementById( lyricsInput ).value;
            const resultDiv = document.getElementById( result );

            if (!music || !lyrics) {
                resultDiv.style.color = "#ff6b6b";
                resultDiv.innerHTML = "⚠️ الرجاء تعبئة وصف اللحن والكلمات أولاً!";
                return;
            }

            resultDiv.style.color = "#4ea8de";
            resultDiv.innerHTML = "⏳ جاري معالجة وتوليد الأغنية...";

            // محاكاة عملية التوليد
            setTimeout(() => {
                resultDiv.style.color = "#52b788";
                resultDiv.innerHTML = "✅ تم توليد الأغنية بنجاح!";
            }, 3000);
        }
    </script>

    <!-- أداة المطورين (Console) للجوال لمعرفة الأخطاء إن وجدت -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

</body>
</html>
